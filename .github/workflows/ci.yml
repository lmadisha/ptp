name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26          # Apple silicon runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: PTPCore tests
        run: swift test --package-path Packages/PTPCore
      - name: Build PTPApp (iOS Simulator)
        run: xcodebuild -project PTP.xcodeproj -scheme PTPApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build PTPWatch (watchOS Simulator)
        run: xcodebuild -project PTP.xcodeproj -scheme PTPWatch -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Hook tests
        run: python3 .claude/hooks/test_guard_bash.py
